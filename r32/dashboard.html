<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meme Sniper R32</title><style> *{box-sizing:border-box}body{margin:0;background:#0d1420;color:#e7edf7;font:15px system-ui}main{max-width:1100px;margin:auto;padding:30px}header{display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:25px}h2{font-size:19px}small,p{color:#9baac0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile,section{background:#172233;border:1px solid #26354b;border-radius:13px;padding:20px;margin:12px 0}.tile strong{display:block;font-size:28px;margin-top:10px}button{background:#254b79;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 8px;border-bottom:1px solid #28364a}th{color:#9baac0;font-weight:500} .scroll{overflow:auto}.muted{color:#9baac0}</style><main><header><div><small>PAPER · Kein Echtgeld</small><h1>MEME SNIPER R32</h1></div><button id="toggle">Start</button></header><div class="grid"><div class="tile">Startbudget<strong>500,00 €</strong></div><div class="tile">Verfügbar<strong id="cash">—</strong></div><div class="tile">Investiert<strong id="invested">—</strong></div><div class="tile">Positionen<strong id="count">—</strong></div></div><section><h2>Aktuelle Marktbeobachtung</h2><p id="qualified"></p><div class="scroll"><table><thead><tr><th>Coin</th><th>Netzwerk</th><th>5 Min.</th><th>Status</th></tr></thead><tbody id="watch"></tbody></table></div></section><section><h2>Meine Positionen</h2><div class="scroll"><table><thead><tr><th>Coin</th><th>Kaufzeit</th><th>Einsatz</th><th>Kaufkurs EUR</th></tr></thead><tbody id="positions"></tbody></table></div></section><section><h2>Handelsverlauf</h2><div id="history"></div></section><p id="status"></p><p id="note"></p></main><script>const el=id=>document.getElementById(id),eur=x=>(x/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});function table(id,rows,empty){const b=el(id);b.replaceChildren();for(const row of rows.length?rows:[[empty]]){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=v??'—';tr.append(td)}b.append(tr)}}async function load(toggle=false){try{const r=await fetch(toggle?'/api/toggle':'/api/state',{method:toggle?'POST':'GET'});const d=await r.json(),s=d.state;el('cash').textContent=eur(s.cash);el('invested').textContent=eur(d.invested);el('count').textContent=s.positions.length+' / 10';el('toggle').textContent=s.enabled?'Pausieren':'Start';el('qualified').textContent=d.qualified+' / 10 bestätigte Einstiege · 50 € je Coin';table('watch',d.shortlist.map(x=>[x.symbol,x.chain,x.change==null?'—':x.change+' %',x.status]),'Keine frischen Marktbeobachtungen');table('positions',s.positions.map(x=>[x.symbol,x.at,eur(x.amount),x.entry]),'Keine offenen Positionen');el('history').textContent=s.history.length?s.history.map(x=>x.action+' '+x.symbol+' · '+x.amount+' €').join(' | '):'Noch keine Trades';el('status').textContent='GitHub: '+(d.last?new Date(d.last).toLocaleTimeString():'noch nicht abgerufen')+(d.errors.length?' · '+d.errors.join(' · '):'');el('note').textContent=d.note}catch(e){el('status').textContent='Lokaler Server nicht erreichbar'}}el('toggle').onclick=()=>load(true);load();setInterval(load,5000)</script></html>
