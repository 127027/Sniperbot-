name: R29 V2.10 compare and targeted historical chain evidence
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/v210-evidence-requests/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-v210-historical-evidence
  cancel-in-progress: false
jobs:
  compare-and-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/v210-compare-and-midnight-chain.mjs
      - uses: actions/download-artifact@v4
        with:
          name: r29-v29-24hour-feature-candidates-45344389914
          run-id: '45344389914'
          github-token: ${{ github.token }}
          path: probe-artifacts/v210-old
      - uses: actions/download-artifact@v4
        with:
          name: r29-v29-24hour-feature-candidates-45348562128
          run-id: '45348562128'
          github-token: ${{ github.token }}
          path: probe-artifacts/v210-new
      - run: node scripts/v210-compare-and-midnight-chain.mjs
      - if: always()
        run: test -z "$(git status --porcelain -- signals runner)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-v210-comparison-and-chain-${{ github.run_id }}
          path: probe-artifacts/v210-evidence-*/
          retention-days: 30
