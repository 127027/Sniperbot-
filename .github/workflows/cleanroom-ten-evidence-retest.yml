name: R31 paced recovery and ten quote security diagnostics
on:
  push:
    branches: ['codex/r31-autonomy-recovery']
    paths: ['research/cleanroom/paced-provider.mjs','research/cleanroom/ten-evidence-retest.mjs','.github/workflows/cleanroom-ten-evidence-retest.yml']
permissions:
  contents: read
jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/readonly-roundtrip-probe.mjs --self-test
      - run: node research/cleanroom/ten-evidence-retest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ten-evidence-retest
          path: |
            paced-results.json
            ten-roundtrip.json
            ten-security.json
