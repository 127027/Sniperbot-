name: R29 W03 historical FX and 50 USDC curve model
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/w03-model-requests/**']
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-historical-curve-model.test.mjs
      - run: node scripts/r29-w03-model-quotes.mjs
      - if: always()
        run: test -z "$(git status --porcelain -- signals runner)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-w03-curve-model-${{ github.run_id }}
          path: probe-artifacts/w03-model-*/
          retention-days: 30
