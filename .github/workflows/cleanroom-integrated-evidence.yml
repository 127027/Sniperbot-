name: R31 integrated evidence acceptance
on:
  push:
    branches: ['codex/r31-autonomy-recovery']
    paths: ['research/cleanroom/integrated-evidence.mjs','.github/workflows/cleanroom-integrated-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/integrated-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-evidence
          path: integrated-evidence.json
