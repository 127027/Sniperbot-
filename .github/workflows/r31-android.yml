name: R31 Android Paper APK
on:
  push:
    branches: [codex/r31-control-center-paper, codex/r40-device-updater]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test r31/android/mobile.test.mjs r31/android/end-to-end.test.mjs r31/telemetry.test.mjs
      - run: bash r31/android/build.sh
      - name: R43 persistent signer regression (disposable fixture only)
        if: github.ref == 'refs/heads/codex/r40-device-updater'
        run: |
          set -euo pipefail
          umask 077
          export R40_SIGNING_KEYSTORE="$RUNNER_TEMP/fixture.jks"
          export R40_SIGNING_STORE_PASS=fixture123 R40_SIGNING_KEY_PASS=fixture123 R40_SIGNING_ALIAS=fixture
          trap 'rm -f "$R40_SIGNING_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$R40_SIGNING_KEYSTORE" -storepass "$R40_SIGNING_STORE_PASS" -keypass "$R40_SIGNING_KEY_PASS" -alias fixture -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI fixture only" >/dev/null 2>&1
          export R43_CERT_SHA256="$(keytool -exportcert -keystore "$R40_SIGNING_KEYSTORE" -storepass "$R40_SIGNING_STORE_PASS" -alias fixture | sha256sum | cut -d' ' -f1)"
          cp r31/android/out/R31-Paper-Android.apk "$RUNNER_TEMP/ordinary-test.apk"
          bash r31/android/release-android.sh
          cp r31/android/out/release-metadata.json "$RUNNER_TEMP/first.json"
          bash r31/android/release-android.sh
          node -e "const a=require(process.env.RUNNER_TEMP+'/first.json'),b=require('./r31/android/out/release-metadata.json');if(a.certificate_sha256!==b.certificate_sha256||a.version_code!==43||b.version_code!==43)process.exit(1)"
          if env -u R40_SIGNING_KEYSTORE R43_RELEASE=1 bash r31/android/build.sh; then echo 'ERROR: release fallback allowed'; exit 1; fi
          mv "$RUNNER_TEMP/ordinary-test.apk" r31/android/out/R31-Paper-Android.apk
          (cd r31/android/out && sha256sum R31-Paper-Android.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: R31-Paper-Android
          path: |
            r31/android/out/R31-Paper-Android.apk
            r31/android/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
