name: R31 Android Paper APK
on:
  push:
    branches: [codex/r31-control-center-paper]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: node --test r31/android/mobile.test.mjs r31/android/end-to-end.test.mjs r31/telemetry.test.mjs
      - run: bash r31/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: R31-Paper-Android
          path: |
            r31/android/out/R31-Paper-Android.apk
            r31/android/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
