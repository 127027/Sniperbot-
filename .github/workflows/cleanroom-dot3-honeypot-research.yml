name: R29 Cleanroom Dot3 Honeypot Research Only
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/risk-requests/**'
permissions:
  contents: write
concurrency:
  group: r29-cleanroom-dot3-honeypot-research
  cancel-in-progress: false
jobs:
  public-security-research-only:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R29_MODE: PAPER_RESEARCH_ONLY
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout exact approved single-request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect one free public EVM security analysis, never authorize trade
        id: security_capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloud-honeypot-risk-research.mjs
      - name: Preserve original HTTP bytes and rate-limit state even after a 429
        if: ${{ always() && steps.security_capture.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/feeds/ research/risk/state/
          git diff --cached --quiet && exit 0
          git commit -m "data(cleanroom): archive read-only Honeypot provider source and budget"
          success=0
          for attempt in 1 2 3 4; do
            git fetch origin codex/r29-cleanroom-paper-20261121
            git rebase origin/codex/r29-cleanroom-paper-20261121
            if git push origin HEAD:refs/heads/codex/r29-cleanroom-paper-20261121; then
              success=1
              break
            fi
          done
          test "$success" = 1
      - name: Assert no Paper or live orders and preserve original provider failure
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain -- signals/index.json signals/orders signals/receipts | wc -l | tr -d ' ')" = "0"
          test "${{ steps.security_capture.outcome }}" = "success"
