name: R31 broad registry priority scan
on:
  push:
    branches: ['codex/r31-autonomy-recovery']
    paths: ['research/cleanroom/broad-research.mjs','research/cleanroom/same-run-dispatch.mjs','research/cleanroom/ranked-deep-cycle.mjs','research/cleanroom/night-batch-runner.mjs','r31/research/cleanroom/night-trigger.json','.github/workflows/cleanroom-broad-research.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r31-broad-research
  cancel-in-progress: false
jobs:
  broad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R31_DISPATCH_PATH: ranked-dispatch.json
      R31_SAME_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: cleanroom-collector-r31-pilot-v1
          path: collector-data
          persist-credentials: false
      - name: Pin actual collector checkout for provenance
        run: |
          registry_commit=$(git -C collector-data rev-parse HEAD)
          [[ "$registry_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "REGISTRY_COMMIT=$registry_commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/broad-research.mjs --self-test
      - run: node research/cleanroom/same-run-dispatch.mjs --self-test
      - run: node research/cleanroom/ranked-deep-cycle.mjs --self-test
      - run: node research/cleanroom/night-batch-runner.mjs --self-test
      - run: node research/cleanroom/broad-research.mjs
      - run: node research/cleanroom/same-run-dispatch.mjs
      - run: node research/cleanroom/night-batch-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-research-and-deep-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: |
            broad-research.json
            broad-observations.json
            ranked-dispatch.json
            ranked-packet.json
            ranked-summary.json
            night-evidence/
