name: R29 V2 fresh-5m 60-day GPT-authored research policy diagnostic
on:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-60day-fresh5m-v2-policy.yml'
      - 'research/replay-120d-real/gpt-fresh5m-60day-v2-research*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure NO autonomous trading and test fresh risk gates
        run: node --test research/replay-120d-real/gpt-fresh5m-60day-v2-research.test.mjs
      - name: Restore independently archived 43 source days of minute-fresh as-of frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r29-43d-fresh5
          gh run download 44048309420 \
            --repo 127027/Sniperbot- \
            --name r29-real-43day-fresh5minute-candidates-no-fills-v2 \
            --dir /tmp/r29-43d-fresh5
          test -f /tmp/r29-43d-fresh5/SUMMARY.json
          test -f /tmp/r29-43d-fresh5/2026-10-02.json
          test -f /tmp/r29-43d-fresh5/2026-11-05.json
      - name: Re-run all 60 days without using future rug labels for decisions
        run: |
          node research/replay-120d-real/gpt-fresh5m-60day-v2-research.mjs \
            --frames /tmp/r29-43d-fresh5 \
            --matrix research/replay-120d-real/results/REAL_60_DAY_EVIDENCE_MATRIX_43D_2026-11-16.csv \
            --out R29_FRESH5_V2_DIAGNOSTIC
      - name: Assert source gaps remain UNKNOWN and no invented PnL or fills
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const o=JSON.parse(readFileSync('R29_FRESH5_V2_DIAGNOSTIC/R29_FRESH5_V2_SUMMARY.json','utf8'));
          assert.equal(o.days,60);
          assert.equal(o.source_days,43);
          assert.equal(o.source_gaps,17);
          assert.equal(o.historical_executed_buy,0);
          assert.equal(o.historical_executed_sell,0);
          assert.equal(o.confirmed_60day_pnl_test_usdc,null);
          assert.equal(o.out_of_sample_result,false);
          console.log('R29_60DAY_FRESH5_V2_INSAMPLE_DIAGNOSTIC',o.proxy_scans,o.review_episodes_with_watch);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: r29-60day-fresh5-v2-insample-research-only-no-trades
          path: R29_FRESH5_V2_DIAGNOSTIC/
          if-no-files-found: error
          retention-days: 30
