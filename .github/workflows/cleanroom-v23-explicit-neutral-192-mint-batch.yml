name: R29 V2.3 Explicit Neutral 192 Mint Batch Source Research
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/neutral-batch-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-v23-explicit-192-mint-neutral-research
  cancel-in-progress: false
jobs:
  postevent-only-neutral-identity:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout exact immutable user-approved request without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full isolated research and no-broker regressions
        run: |
          set -euo pipefail
          npm test
      - name: Verify original strict QA04 hold remains blocked pending genuine evidence
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Download already pinned neutral retrospective Oct 11 and 12 raw source artifact
        uses: actions/download-artifact@v4
        with:
          name: r29-real-43day-fresh5minute-candidates-no-fills-v2
          repository: 127027/Sniperbot-
          run-id: '44048309420'
          github-token: ${{ github.token }}
          path: probe-artifacts/neutral-source-v2
      - name: Exactly seven read-only public token-to-pool batches, no asof promotion
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v23-oct12-neutral-batch-research.mjs
      - name: Verify checkout did not write any GitHub client signal or paper receipt
        shell: bash
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals/index.json signals/orders signals/receipts)"
      - name: Archive original provider HTTP raw bytes and postrun-only research verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v23-oct12-neutral-192-mint-source-${{ github.run_id }}
          path: |
            probe-artifacts/v23-oct12-neutral-batches-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          retention-days: 30
          if-no-files-found: warn
