name: R29 Original Oct12 Solana SellV2 SellV3 Source-Only Audit
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/oct12-sell-original-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-original-oct12-four-third-party-sells
  cancel-in-progress: false
jobs:
  postrun-only-original-sell-provenance:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout only exact user-approved source-only request without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check full regression suite and research-only script syntax
        run: |
          node --check src/v19-oct12-original-sell-instruction-audit.mjs
          node --check scripts/v19-audit-four-original-oct12-third-party-sells.mjs
          npm test
      - name: Keep all original QA04 D3-04 D3-05 requirements locked unless independently proven
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Download SHA pinned original four pre-scan Solana V1 transaction raw bytes
        uses: actions/download-artifact@v4
        with:
          name: r29-oct12-v1-four-transaction-research-45135625789
          repository: 127027/Sniperbot-
          run-id: '45135625789'
          github-token: ${{ github.token }}
          path: probe-artifacts/old-solana-v1-four-tx
      - name: Offline prove SellV2/V3 program logs plus exact Token2022 checked pool transfers
        run: node scripts/v19-audit-four-original-oct12-third-party-sells.mjs
      - name: Never modify GitHub order or existing client account data
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Upload complete original source-only sell instruction audit and strict blocked gate
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-original-oct12-sellv2v3-${{ github.run_id }}
          path: |
            probe-artifacts/r29-oct12-original-third-party-sells-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
