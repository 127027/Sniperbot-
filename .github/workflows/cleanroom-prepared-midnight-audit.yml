name: R29 predecision preparation audit
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/prepared-audit-requests/**']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-prepared-session.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: r29-v29-24hour-feature-candidates-45348562128
          run-id: '45348562128'
          github-token: ${{ github.token }}
          path: probe-artifacts/prepared
      - run: node scripts/r29-audit-prepared-midnight.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r29-prepared-midnight-audit-${{ github.run_id }}
          path: probe-artifacts/prepared-audit/
          retention-days: 30
