name: R29 second neutral long-history archive availability
on:
  workflow_dispatch:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-second-neutral-archive-head-pilot.yml'
      - 'research/replay-120d-real/neutral-second-archive-head-pilot*'
permissions:
  contents: read
jobs:
  neutral-readonly-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run neutral source and no-fake-fill regression tests
        run: node --test research/replay-120d-real/neutral-second-archive-head-pilot.test.mjs
      - name: Check eight training/holdout anchor objects HEAD only, zero archive body downloads
        run: node research/replay-120d-real/neutral-second-archive-head-pilot.mjs R29_SECOND_ARCHIVE/anchors.json
      - name: Assert no future known winners or portfolio transactions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const d=JSON.parse(readFileSync('R29_SECOND_ARCHIVE/anchors.json','utf8'));
          assert.equal(d.anchors.length,8);
          assert.equal(d.no_winner_mints_or_symbols_selected,true);
          assert.equal(d.archive_head_only_no_transactions_read,true);
          assert.equal(d.portfolio_pnl_test_usdc,null);
          console.log('R29_SECOND_ARCHIVE_COUNTS',d.head_ok_count);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: r29-second-neutral-archive-8-anchor-head-status-no-trades
          path: R29_SECOND_ARCHIVE/
          if-no-files-found: error
          retention-days: 30
