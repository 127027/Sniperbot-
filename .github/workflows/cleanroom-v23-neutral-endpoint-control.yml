name: R29 V2.3 Neutral Two Mint Endpoint Control
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/neutral-endpoint-requests/**'
permissions:
  contents: read
concurrency:
  group: r29-v23-two-neutral-mint-six-endpoint-control
  cancel-in-progress: false
jobs:
  source-control:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Exact user-approved research commit without checkout write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository regressions
        run: npm test
      - name: Six public GET endpoint controls with no orders or wallets
        run: node scripts/v23-neutral-provider-endpoint-control.mjs
      - name: Confirm no signal, orders, or receipts were changed
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Preserve complete raw provider responses and postevent verdicts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v23-neutral-endpoint-control-${{ github.run_id }}
          path: probe-artifacts/v23-neutral-control-*/
          if-no-files-found: warn
          retention-days: 30
