name: R29 V1.9 Manual 29h Backtest (Paper Research)
on:
  workflow_dispatch:
    inputs:
      test_date:
        description: 'UTC decision date (YYYY-MM-DD)'
        type: string
        required: true
        default: '2026-10-12'
      manifest_path:
        description: 'Optional neutral as-of JSON under research/backtest-inputs/'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: r29-manual-backtest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cleanroom-backtest:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_TEST_DATE: ${{ inputs.test_date }}
      R29_MANIFEST: ${{ inputs.manifest_path }}
    steps:
      - name: Checkout selected immutable cleanroom revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate requested date, source branch and neutral input path
        run: |
          node --input-type=module -e 'import {validateManualBacktestRequest} from "./src/v19-manual-backtest-request.mjs"; const x=validateManualBacktestRequest({date:process.env.R29_TEST_DATE,inputPath:process.env.R29_MANIFEST,ref:process.env.GITHUB_REF}); console.log(JSON.stringify(x));'
      - name: Run full cleanroom regression suite before replay
        run: npm test
      - name: Run same unified Dot4 research replay on demand
        shell: bash
        run: |
          set -euo pipefail
          args=(--date "$R29_TEST_DATE")
          if [[ -n "$R29_MANIFEST" ]]; then
            args+=(--input "$R29_MANIFEST")
          fi
          node scripts/v18-backtest-on-demand.mjs "${args[@]}"
      - name: Upload isolated research report (no repo writes)
        uses: actions/upload-artifact@v4
        with:
          name: r29-v19-manual-research-${{ github.run_id }}
          path: probe-artifacts/*.json
          if-no-files-found: error
          retention-days: 30
