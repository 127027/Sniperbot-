name: R29 targeted midnight evidence enrichment
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/enrichment-requests/**']
permissions:
  contents: write
concurrency:
  group: r29-preparation-hour-capture
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r29-cleanroom-paper-20261121
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node --test test/r29-evidence-enrichment.test.mjs test/r29-preparation-queue.test.mjs test/r29-retrospective-execution.test.mjs
      - run: node scripts/r29-enrich-midnight-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-midnight-enrichment
          path: |
            research/preparation/enrichment/
          retention-days: 30
