name: R24 historical 50 Solana launch candidates (free, research only)
on:
  push:
    branches: ['codex/dots-pepe-replay-20261113']
    paths:
      - 'research/replay-controller/r24-public-launch-cohort.py'
      - '.github/workflows/r24-50-launches.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r24-public-50-candidates
  cancel-in-progress: true
jobs:
  public-neutral-launch-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SNIPER_OFFLINE: '1'
      SNIPER_RESEARCH_READ: '0'
      SNIPER_RESEARCH_FEED: '0'
      SNIPER_LOCAL_DISCOVERY: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic no-leak synthetic selftest first
        run: python research/replay-controller/r24-public-launch-cohort.py --self-test
      - name: Install offline parquet parser (not an LLM; no paid data provider)
        run: python -m pip install --disable-pip-version-check duckdb==1.4.2 pytz
      - name: Download only public 2026 historical launch table
        run: |
          curl --fail --location --show-error --silent --retry 1 --retry-delay 5 \
            --connect-timeout 15 --max-time 180 --max-filesize 262144000 \
            https://huggingface.co/datasets/Slinky21/Pumpfun_Memecoin_Corpus/resolve/main/tokens.parquet \
            --output r24-tokens-source.parquet
          test -s r24-tokens-source.parquet
          sha256sum r24-tokens-source.parquet
      - name: Produce 50 future-label-free real launch candidates across ten historical days
        run: |
          python research/replay-controller/r24-public-launch-cohort.py \
            --tokens=r24-tokens-source.parquet \
            --start=2026-06-12T00:00:00Z \
            --end-exclusive=2026-06-22T00:00:00Z \
            --per-day=5 --target=50 \
            --output=r24-50-launch-candidates.json
          python -c "import json; d=json.load(open('r24-50-launch-candidates.json')); assert d['target_candidates_found'] and len(d['launches'])==50 and d['future_outcome_columns_exposed']==False and d['independently_confirmed_memecoins']==0; print('R24_RESEARCH_CANDIDATES_50_CONFIRMED_NOT_TRADES')"
      - name: Upload small public research-only provenance and cohort (no full dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r24-50-historical-launch-candidates
          path: r24-50-launch-candidates.json
          if-no-files-found: ignore
          retention-days: 14
