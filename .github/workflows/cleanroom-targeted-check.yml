name: Cleanroom targeted evidence regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanroom-targeted-check.yml','research/cleanroom/targeted.mjs','research/cleanroom/evidence.mjs','research/cleanroom/token-registry.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/evidence.mjs --self-test
      - run: node research/cleanroom/token-registry.mjs --self-test
      - run: node research/cleanroom/targeted.mjs --self-test
      - run: node research/cleanroom/market-probe.mjs
      - run: node research/cleanroom/evidence.mjs
      - name: Check actual discovery inventory
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const d=JSON.parse(fs.readFileSync("research/cleanroom/evidence-latest.json","utf8")).discovery; assert.equal(d.rows.length,d.distinct_contracts); assert.equal(d.rows.filter(r=>!r.joined_asset).length,d.not_joined); assert.ok(d.rows.every(r=>r.classification==="UNVERIFIED_DISCOVERY_LEAD")); console.log(JSON.stringify({distinct_contracts:d.distinct_contracts,not_joined:d.not_joined}));'
      - run: node research/cleanroom/targeted.mjs
      - name: Check bounded candidate evidence pages
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p="research/cleanroom/candidate-pages/"; const j=JSON.parse(fs.readFileSync(p+"index.json")); const t=JSON.parse(fs.readFileSync("research/cleanroom/targeted-latest.json")); const ids=[]; for(const x of j.pages){const z=JSON.parse(fs.readFileSync(p+x.file)); assert.equal(z.snapshot,j.snapshot); assert.equal(z.rows.length,x.count); assert.deepEqual(x.ids,z.rows.map(r=>r.id)); assert.ok(z.rows.length<=16); ids.push(...z.rows.map(r=>r.id));} assert.equal(ids.length,t.rows.length); assert.equal(new Set(ids).size,ids.length); assert.equal(j.snapshot,t.finished_at); console.log(JSON.stringify({pages:j.pages.length,rows:ids.length}));'
      - name: Check expanded discovery and actual lead processing
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const t=JSON.parse(fs.readFileSync("research/cleanroom/targeted-latest.json")); const m=JSON.parse(fs.readFileSync("research/cleanroom/market-latest.json")); const l=t.rows.filter(r=>r.id.startsWith("lead:")); assert.equal(l.length,t.summary.raw_leads_checked); assert.ok(l.length>0); assert.ok(l.every(r=>r.decision_status==="RESEARCH_INPUT_NOT_BUY"&&r.classification==="UNVERIFIED_DISCOVERY_LEAD")); assert.ok(l.filter(r=>r.research_ready).every(r=>r.observed_at_utc&&["COMPLETED_POOL_MINUTE_CANDLE_CLOSE_INDICATIVE_PAPER","POOL_LAST_TRADE_USD_FX_INDICATIVE_PAPER"].includes(r.quote_scope))); console.log(JSON.stringify({cursor:m.coverage_cursor,market_pages:m.sources.filter(s=>s.name.startsWith("CoinGecko EUR meme markets")).map(s=>({name:s.name,status:s.status,rows:s.rows.length})),coverage:t.discovery_coverage,summary:t.summary}));'
      - name: Merge live evidence into isolated registry and verify replay
        run: |
          export CLEANROOM_REGISTRY_DIR="$RUNNER_TEMP/cleanroom-registry"
          node research/cleanroom/token-registry.mjs
          node research/cleanroom/token-registry.mjs
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=process.env.CLEANROOM_REGISTRY_DIR; const j=JSON.parse(fs.readFileSync(p+"/index.json")); assert.ok(j.total_contracts>0); assert.equal(j.history.length,1); assert.equal(j.shards.reduce((n,s)=>n+s.count,0),j.total_contracts); console.log(JSON.stringify({registry_total:j.total_contracts,chains:j.by_chain,history:j.history}));'
      - name: Verify cumulative merge across two genuine provider snapshots
        run: |
          export CLEANROOM_REGISTRY_DIR="$RUNNER_TEMP/cleanroom-history-registry"
          git show d71e9ca4936058f4d45c3b3740e0b54b0eb158c8:research/cleanroom/market-latest.json > "$RUNNER_TEMP/prior-market.json"
          git show d71e9ca4936058f4d45c3b3740e0b54b0eb158c8:research/cleanroom/evidence-latest.json > "$RUNNER_TEMP/prior-evidence.json"
          node --input-type=module -e 'import fs from "node:fs"; const p=process.env.RUNNER_TEMP; const e=JSON.parse(fs.readFileSync(p+"/prior-evidence.json")); const m=JSON.parse(fs.readFileSync(p+"/prior-market.json")); const rows=[]; for(const s of m.sources) if(s.status==="OK") for(const r of s.rows) if(r.chain&&r.contract) rows.push({chain:r.chain,contract:r.contract,observations:[{source:s.name,url:s.url,retrieved_at:s.finished_at,symbol:r.symbol,pool:r.pool}]}); e.discovery={rows}; fs.writeFileSync(p+"/prior-evidence.json",JSON.stringify(e));'
          CLEANROOM_EVIDENCE="$RUNNER_TEMP/prior-evidence.json" node research/cleanroom/token-registry.mjs
          node research/cleanroom/token-registry.mjs
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const j=JSON.parse(fs.readFileSync(process.env.CLEANROOM_REGISTRY_DIR+"/index.json")); assert.equal(j.history.length,2); assert.ok(j.history[1].total>=j.history[0].total); assert.ok(j.history[1].total===j.history[0].total+j.history[1].added); console.log(JSON.stringify({historical_live_snapshots:j.history,by_chain:j.by_chain}));'
      - name: Save diagnostics for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-targeted-evidence
          path: |
            research/cleanroom/targeted-latest.json
            ${{ runner.temp }}/cleanroom-registry/index.json
          retention-days: 1
