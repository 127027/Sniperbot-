name: Cleanroom targeted evidence regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanroom-targeted-check.yml','research/cleanroom/targeted.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/targeted.mjs --self-test
      - run: node research/cleanroom/market-probe.mjs
      - run: node research/cleanroom/evidence.mjs
      - run: node research/cleanroom/targeted.mjs
      - name: Save diagnostics for inspection
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-targeted-evidence
          path: research/cleanroom/targeted-latest.json
          retention-days: 1
