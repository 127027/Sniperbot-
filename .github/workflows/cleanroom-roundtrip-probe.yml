name: R31 read-only roundtrip probe
on:
  push:
    branches: ['codex/r31-autonomy-recovery']
    paths: ['research/cleanroom/readonly-roundtrip-probe.mjs','.github/workflows/cleanroom-roundtrip-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/readonly-roundtrip-probe.mjs --self-test
      - run: node research/cleanroom/readonly-roundtrip-probe.mjs
