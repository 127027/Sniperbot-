name: Cleanroom market connectivity
on:
  push:
    branches: [main]
    paths: ['research/cleanroom/market-probe.mjs','research/cleanroom/evidence.mjs','research/cleanroom/targeted.mjs','research/cleanroom/watchdog.mjs','research/cleanroom/token-registry.mjs','.github/workflows/cleanroom-market-probe.yml']
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanroom-market-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 30 || 12 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/market-probe.mjs --self-test
      - run: node research/cleanroom/evidence.mjs --self-test
      - run: node research/cleanroom/targeted.mjs --self-test
      - run: node research/cleanroom/token-registry.mjs --self-test
      - name: Configure dedicated research checkout
        run: |
          git config user.name "Cleanroom market probe"
          git config user.email "actions@users.noreply.github.com"
      - name: Measured data watchdog
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            node research/cleanroom/watchdog.mjs --cycles=5 --publish
          else
            node research/cleanroom/watchdog.mjs --once --publish
          fi
      - name: Verify published checkpoint and actual quote freshness
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const dir='research/cleanroom/';
          const h=JSON.parse(fs.readFileSync(dir+'watchdog-checkpoints.json','utf8'));
          const last=h.samples.at(-1);
          const health=JSON.parse(fs.readFileSync(dir+'collector-health.json','utf8'));
          assert.equal(health.run_id,process.env.GITHUB_RUN_ID,'Health belongs to another run');
          assert.equal(health.status,'OK','Collector health failed');
          assert.equal(last.run_id,process.env.GITHUB_RUN_ID,'No checkpoint for this run');
          assert.equal(last.status,'OK','Collector cycle failed; see checkpoint source logs');
          const index=JSON.parse(fs.readFileSync(dir+'candidate-pages/index.json','utf8'));
          assert.equal(health.snapshot,index.snapshot,'Health and published evidence disagree');
          const now=Date.now(), age=now-Date.parse(index.snapshot);
          assert.ok(Number.isFinite(age)&&age>=0&&age<=300000,'Snapshot not freshly published');
          let fresh=0;
          for(const p of index.pages){
            const page=JSON.parse(fs.readFileSync(dir+'candidate-pages/'+p.file,'utf8'));
            assert.equal(page.snapshot,index.snapshot,'Mixed snapshots');
            for(const r of page.rows){
              const t=now-Date.parse(r.observed_at_utc);
              if(r.research_ready&&Number.isFinite(t)&&t>=0&&t<=900000&&Number.isFinite(r.price_eur)&&r.price_eur>0)fresh++;
            }
          }
          console.log(JSON.stringify({run_id:last.run_id,snapshot:index.snapshot,snapshot_age_ms:age,fresh_research_quotes:fresh}));
          assert.ok(fresh>0,'No fresh research-ready quotes');
          JS
