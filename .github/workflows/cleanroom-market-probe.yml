name: Cleanroom market connectivity
on:
  push:
    branches: [main]
    paths: ['research/cleanroom/market-probe.mjs','research/cleanroom/evidence.mjs','.github/workflows/cleanroom-market-probe.yml']
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanroom-market-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/market-probe.mjs --self-test
      - run: node research/cleanroom/evidence.mjs --self-test
      - run: node research/cleanroom/market-probe.mjs
      - run: node research/cleanroom/evidence.mjs
      - name: Save latest research-only evidence and append bounded checkpoint
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="research/cleanroom/evidence-checkpoints.json"; const e=JSON.parse(fs.readFileSync("research/cleanroom/evidence-latest.json")); const old=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):{schema:"cleanroom.evidence.checkpoints.v1",samples:[]}; old.samples.push({finished_at:e.finished_at,joined:e.joined_count,unresolved:e.unresolved_count,news:e.news.length,sources:e.source_logs});old.samples=old.samples.slice(-144);fs.writeFileSync(p,JSON.stringify(old,null,2)+"\n")'
          git config user.name "Cleanroom market probe"
          git config user.email "actions@users.noreply.github.com"
          git add research/cleanroom/market-latest.json research/cleanroom/evidence-latest.json research/cleanroom/evidence-checkpoints.json
          git diff --cached --quiet && exit 0
          git commit -m "Cleanroom public market evidence (research only)"
          git push origin HEAD:main
      - name: Check data readiness (not a trading signal)
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("research/cleanroom/evidence-latest.json")); console.log("Mapped fresh EUR assets: "+x.joined_count+"; news: "+x.news.length); if(x.joined_count<10)process.exit(1)'
