name: Cleanroom market connectivity
on:
  push:
    branches: [main]
    paths: ['research/cleanroom/market-probe.mjs','research/cleanroom/evidence.mjs','research/cleanroom/targeted.mjs','research/cleanroom/watchdog.mjs','research/cleanroom/token-registry.mjs','.github/workflows/cleanroom-market-probe.yml']
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cleanroom-market-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/market-probe.mjs --self-test
      - run: node research/cleanroom/evidence.mjs --self-test
      - run: node research/cleanroom/targeted.mjs --self-test
      - run: node research/cleanroom/token-registry.mjs --self-test
      - name: Configure dedicated research checkout
        run: |
          git config user.name "Cleanroom market probe"
          git config user.email "actions@users.noreply.github.com"
      - name: Measured data watchdog
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            node research/cleanroom/watchdog.mjs --once --publish
          else
            node research/cleanroom/watchdog.mjs --publish
          fi
