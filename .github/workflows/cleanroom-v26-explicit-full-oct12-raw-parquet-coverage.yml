name: R29 V2.6 Explicit Full Oct12 Historical Raw Feature Population
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/raw-full-day-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-v26-original-two-day-neutral-full-raw-source
  cancel-in-progress: false
jobs:
  sha-pinned-full-raw-mint-research:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
      R29_V26_EXPLICIT_REQUEST_PATH: research/raw-full-day-requests/2026-11-23/r29-user-go-replace-192-with-full-two-day-pinned-source.json
    steps:
      - name: Strictly one immutable authorized request commit without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Python 3.12 open-source research-only runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check and synthetic no-lookahead unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/v26-rebuild-oct12-full-raw-feature-population.py
          python test/v26-full-parquet-coverage.test.py
      - name: Open-source Parquet decoder, no paid API or private keys
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pyarrow==21.0.0'
      - name: Fetch already archived 43-day hour-boundary source manifest without modification
        uses: actions/download-artifact@v4
        with:
          name: r29-real-43day-fresh5minute-candidates-no-fills-v2
          repository: 127027/Sniperbot-
          run-id: '44048309420'
          github-token: ${{ github.token }}
          path: probe-artifacts/neutral-source-v26
      - name: Download 2 immutable original Parquet blobs and reconstruct all feature mints per hour
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v26-rebuild-oct12-full-raw-feature-population.py \
            "probe-artifacts/v26-full-two-day-source-${{ github.run_id }}" \
            "probe-artifacts/neutral-source-v26"
      - name: Guarantee zero client signal/receipt/wallet changes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals runner)"
      - name: Preserve verified original SHA and full neutral hourly research population
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v26-full-oct12-raw-neutral-source-${{ github.run_id }}
          path: probe-artifacts/v26-full-two-day-source-*/
          if-no-files-found: warn
          retention-days: 30
