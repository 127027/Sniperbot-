name: R29 Oct12 Original Solana V1 Transaction Details Strict Retry
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/oct12-v1-details-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-oct12-v1-four-tx-details
  cancel-in-progress: false
jobs:
  four-readonly-original-chain-tx-details:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout only exact one-file source request without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full protective tests and RPC script syntax
        run: |
          node --check scripts/v19-research-oct12-solana-v1-details-only.mjs
          npm test
      - name: Keep historic originals-only QA04 Gate locked unless authenticated
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Retrieve exact pinned first pass deep onchain signatures and 4 v0 errors
        uses: actions/download-artifact@v4
        with:
          name: r29-oct12-two-pool-onchain-readonly-45135241060
          repository: 127027/Sniperbot-
          run-id: '45135241060'
          github-token: ${{ github.token }}
          path: probe-artifacts/original-onchain-run
      - name: Read exactly four already selected pre-scan transactions with Solana RPC version 1
        run: node scripts/v19-research-oct12-solana-v1-details-only.mjs
      - name: Prove no order or wallet files were touched
        shell: bash
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Store original public RPC response bytes and neutral research receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-oct12-v1-four-transaction-research-${{ github.run_id }}
          path: |
            probe-artifacts/r29-oct12-tx-v1-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
