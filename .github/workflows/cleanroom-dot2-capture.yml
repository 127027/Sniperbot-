name: R29 Cleanroom Dot2 JSON Capture
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/requests/**'
permissions:
  contents: write
concurrency:
  group: r29-cleanroom-dot2-capture
  cancel-in-progress: false
jobs:
  capture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated cleanroom branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture public research evidence
        id: dot2_capture
        continue-on-error: true
        run: node scripts/cloud-discovery-runner.mjs
      - name: V1.4 capture public meme and news evidence
        id: media_capture
        if: ${{ steps.dot2_capture.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/cloud-media-capture.mjs
      # Never discard a real HTTP 429/503 receipt or a staged pending cursor
      # merely because a later decoder, risk preview, or media step failed.
      # Preserve the workflow's FAILED outcome with the last step below.
      - name: Commit research feed and partial recovery state to cleanroom branch
        if: ${{ always() && steps.dot2_capture.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/feeds/ research/state/ research/observations/ research/media/ research/forecasts/
          git diff --cached --quiet && exit 0
          git commit -m "data(cleanroom): capture authenticated Dot2 research feed"
          success=0
          for attempt in 1 2 3 4; do
            git fetch origin codex/r29-cleanroom-paper-20261121
            git rebase origin/codex/r29-cleanroom-paper-20261121 || exit 1
            if git push origin HEAD:refs/heads/codex/r29-cleanroom-paper-20261121; then
              success=1
              break
            fi
          done
          test "$success" = 1
      - name: Report incomplete or failed research capture honestly
        if: ${{ always() }}
        run: |
          test "${{ steps.dot2_capture.outcome }}" = "success"
          test "${{ steps.media_capture.outcome }}" = "success"
