name: R29 60-Day Prior-Loss Cooldown Research - No GPT or Real Trading
on:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - 'research/replay-120d-real/cex-loss-control-diagnostic.mjs'
      - 'research/replay-120d-real/cex-loss-control-diagnostic.test.mjs'
      - '.github/workflows/r29-60d-loss-control-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prior_closed_loss_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SNIPER_REAL_TRADING_ENABLED: '0'
      PAPER_ONLY: '1'
      SNIPER_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove baseline 60-day reproduction and no future-loss leakage
        run: node --test research/replay-120d-real/cex-loss-control-diagnostic.test.mjs
      - name: Compute exploratory 7d and 14d prior-loss-only cooldown counterfactual
        run: node research/replay-120d-real/cex-loss-control-diagnostic.mjs
      - name: Archive research-only diagnostics, never GPT or DEX fills
        uses: actions/upload-artifact@v4
        with:
          name: r29-60day-cex-price-only-anti-repeat-loss-exploration
          path: |
            research/replay-120d-real/generated/60d-retrospective-loss-controls-summary.json
            research/replay-120d-real/generated/60d-loss-control-7d-daily.json
            research/replay-120d-real/generated/60d-loss-control-7d-events.json
            research/replay-120d-real/generated/60d-loss-control-14d-daily.json
            research/replay-120d-real/generated/60d-loss-control-14d-events.json
          if-no-files-found: error
          retention-days: 30
