name: R29 pinned V3 and creation archive re-decode
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/redecode-requests/**']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-evidence-enrichment.test.mjs test/r29-retrospective-execution.test.mjs
      - run: node scripts/r29-redecode-pinned-swaps.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r29-redecode
          path: probe-artifacts/r29-redecode/
          retention-days: 30
