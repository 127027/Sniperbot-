name: R29 Cleanroom Paper Tests
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanroom branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: V1.2 frozen six-pool Dot3 risk queue and Dot4 guarded-reentry replay
        run: node scripts/replay-v12-frozen-risk.mjs
      - name: Oct 12 training - 24 hourly research scans and five-dot duty audit
        continue-on-error: false
        timeout-minutes: 7
        run: node scripts/train-oct12-24-scans.mjs
      - name: V1.1 first full as-of scan followed by 23 incremental market-memory scans
        run: node scripts/replay-v11-first-scan.mjs
      - name: V0.9 compare repeated 24 hourly training scans and actual Dot reports
        run: node scripts/compare-v09-backtest.mjs
      - name: Non-trading historical GeckoTerminal probe (informational only)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/forensic-probe-15nov.mjs
      - name: Live public JSON discovery probe (research only)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/probe-live-discovery.mjs
      - name: Upload forensic diagnostic (not a trade receipt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ohlcv-probe
          path: probe-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Isolated tree assertion
        run: |
          test ! -e runner
          test ! -e Windows_Starten.bat
          test -f src/core.mjs
