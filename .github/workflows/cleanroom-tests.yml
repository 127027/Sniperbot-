name: R29 Cleanroom Paper Tests
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      run_provider_probes:
        description: "Explicit opt-in: live public provider probes (may consume rate limits)"
        type: boolean
        required: false
        default: false
      run_training_replays:
        description: "Explicit opt-in: historical training/replay CLIs (OFF by default; do not use until approved)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  paper-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanroom branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Require 100-percent original acceptance before any manual historical replay
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v19-verify-100pct-before-backtest.mjs --require-ready
      - name: V1.3 prospective temporal learning audit (no labels before horizon)
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/audit-v13-learning.mjs
      - name: V1.6 Oracle ZIP historical research (isolated outputs, 65 references)
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/replay-v16-oracle.mjs
      - name: V1.5 frozen Oct 12 paired news-vs-no-news 24 scans
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/replay-v15-historical-media.mjs
      - name: V1.2 frozen six-pool Dot3 risk queue and Dot4 guarded-reentry replay
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/replay-v12-frozen-risk.mjs
      - name: Oct 12 training - 24 hourly research scans and five-dot duty audit
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        continue-on-error: false
        timeout-minutes: 7
        run: node scripts/train-oct12-24-scans.mjs
      - name: V1.1 first full as-of scan followed by 23 incremental market-memory scans
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/replay-v11-first-scan.mjs
      - name: V0.9 compare repeated 24 hourly training scans and actual Dot reports
        # The user explicitly excluded backtests from the current work.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_training_replays == true }}
        run: node scripts/compare-v09-backtest.mjs
      - name: Non-trading historical GeckoTerminal probe (informational only)
        # Ordinary push CI must NEVER consume real Gecko/DEX rate limits.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_provider_probes == true && github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/forensic-probe-15nov.mjs
      - name: Live public JSON discovery probe (research only)
        # Ordinary push CI must NEVER consume real Gecko/DEX rate limits.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_provider_probes == true && github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/probe-live-discovery.mjs
      - name: Upload forensic diagnostic (not a trade receipt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ohlcv-probe
          path: |
            probe-artifacts/*.json
            probe-artifacts/*.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Isolated tree assertion
        run: |
          test ! -e runner
          test ! -e Windows_Starten.bat
          test -f src/core.mjs
