name: R29 60 neutral training days first 5min original-source frames
on:
  workflow_dispatch:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-60day-training-neutral-source-harvest.yml'
      - 'research/replay-120d-real/neutral-training-60day-first5-source*'
permissions:
  contents: read
jobs:
  chronological-neutral-training-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce July-to-Sept training boundaries and no later winner data
        run: node --test research/replay-120d-real/neutral-training-60day-first5-source.test.mjs
      - name: Neutral five-minute market-observation source only on ten consecutive training dates
        run: |
          node research/replay-120d-real/neutral-training-60day-first5-source.mjs ${{ matrix.chunk }} R29_TRAIN_60D_CHUNK
      - name: Training sources never authorize BUY/SELL or claim historical GPT profits
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const x=JSON.parse(readFileSync('R29_TRAIN_60D_CHUNK/CHUNK_SUMMARY.json','utf8'));
          assert.equal(x.daily.length,10);
          assert.equal(x.training_only_no_buy_or_sell_signal,true);
          assert.equal(x.discovered_without_known_future_winners,true);
          assert.equal(x.never_accessed_posthoc_price_outcomes,true);
          assert.equal(x.independent_GPT_trading_calls_completed,0);
          console.log('R29_TRAIN_10DAY_NEUTRAL_SOURCE',x.chunk_index,x.daily.filter(d=>d.status==='ASOF_ORIGINAL_CAPTURE_TRAINING_SOURCE_FRAME').length);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-60day-training-neutral-original-time-chunk-${{ matrix.chunk }}-no-trades
          path: R29_TRAIN_60D_CHUNK/
          if-no-files-found: warn
          retention-days: 30
