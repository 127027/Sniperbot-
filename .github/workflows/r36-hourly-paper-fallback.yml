name: R46 hourly paper fallback
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r36-hourly-paper-fallback.yml'
permissions:
  contents: read
concurrency:
  group: r36-hourly-paper-fallback
  cancel-in-progress: false
jobs:
  replay:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06f145c912524c026080f8f4dc4b899939f1cf7c
          persist-credentials: false
      - run: node --test r31/hourly-fallback.test.mjs r31/r46-strategy.test.mjs
  fallback:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 06f145c912524c026080f8f4dc4b899939f1cf7c
          persist-credentials: false
      - name: Publish only a missing PAPER_ONLY data-gap closing inside actual :07–:10 window
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node r31/run-hourly-fallback.mjs
