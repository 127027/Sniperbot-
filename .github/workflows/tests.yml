name: Sniper V2 Offline Paper Tests
on:
  push:
    branches-ignore:
      - 'coordination/**'
    paths-ignore:
      - 'research/r29/channel/**'
  pull_request:
permissions:
  contents: read
jobs:
  paper-only:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SNIPER_OFFLINE: '1'
      SNIPER_RESEARCH_READ: '0'
      SNIPER_RESEARCH_FEED: '0'
      SNIPER_LOCAL_DISCOVERY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check runner/server.mjs
      - name: R29 enforce exactly one Windows user starter and no legacy QA budget
        run: node --test runner/single-startfile.test.mjs runner/minimal-ui.test.mjs
      - name: R29 actual ONLY startfile Windows supervisor selftest (no token, no trades)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: call Sniperbot_Starten.bat -SelfTest
      - run: node runner/dashboard-syntax-check.mjs
      - name: R29 real Paper dashboard balance and positions pricing fail-closed
        run: node --test runner/dashboard-portfolio.test.mjs
      - run: node runner/test.mjs
      - name: Offline research, signatures, ledger and replay regression tests
        run: node --test runner/paper-agent-pipeline.test.mjs runner/github-signed-agent-feed.test.mjs runner/isolated-paper-pipeline-selftest.test.mjs runner/market-pool-pinning.test.mjs runner/paper-lifecycle-policy.test.mjs runner/portfolio-budget.test.mjs runner/signed-research-quorum.test.mjs runner/historical-replay-readiness.test.mjs runner/breakout-forecast.test.mjs runner/pipeline-health.test.mjs runner/central-decisions.test.mjs runner/research.test.mjs runner/live-mode-policy.test.mjs runner/gateway.test.mjs runner/integration.test.mjs
      - name: V0.21 single AI coordinator decision, signed paper BUY/SELL, no live money (offline fixtures)
        run: node --test runner/central-ai-coordinator.test.mjs
      - name: R28 local communication diagnostic and durable cycle audit (offline mock; no paid AI)
        run: node --test runner/r28-connection-diagnostic.test.mjs
      - name: R28 real offline local HTTP bot-API-signature handshake (disposable dir)
        run: node runner/r28-local-http-e2e.mjs
      - name: R29 ChatGPT -> GitHub -> isolated signed paper BUY/SELL protocol tests
        run: node --test research/r29/r29-paper-protocol.test.mjs runner/r29-windows-courier.test.mjs runner/r29-regular-presence.test.mjs
      - name: R29 explicitly opted-in existing Paper dashboard BUY/SELL, no wallet and replay-proof
        run: node --test runner/r29-main-paper-demo.test.mjs
      - name: R29 actual Chromium visual render, no old R29 budget (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: node runner/dashboard-headless-browser-check.mjs
      - name: R29 actual localhost HTTP demo Paper BUY and SELL in disposable bot account
        run: node runner/r29-main-paper-local-http-e2e.mjs
      - name: R29 isolated GitHub courier sandbox syntax
        run: node --check research/r29/r29-paper-protocol.mjs && node --check research/r29/r29-ci-process-intent.mjs && node --check runner/r29-windows-courier.mjs && node --check runner/r29-main-paper-demo.mjs
      - name: R28 local connection CLI and cycle audit syntax
        run: node --check runner/r28-connection-diagnostic.mjs && node --check runner/r28-cycle-audit.mjs
      - name: V0.21 coordinator syntax and dashboard smoke
        run: node --check runner/central-ai-coordinator.mjs
      - name: V0.21 Windows supervisor PowerShell parse check
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $tokens=$null
          $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'runner/windows-supervisor.ps1').Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Host ('PS_PARSE_ERROR '+$_.Extent.StartLineNumber+':'+$_.Extent.StartColumnNumber+' '+$_.Message+' >> '+$_.Extent.Text) }; exit 1 }
          Write-Host 'WINDOWS_SUPERVISOR_V021_PARSING_OK'
      - name: R29 Windows supervisor actual process/job/DPAPI selftest (no token, no market)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File runner/windows-supervisor.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: R29 no duplicate GitHub credential; reuse existing Windows DPAPI PAT
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $source = Get-Content runner/windows-supervisor.ps1 -Raw
          if(-not $source.Contains("research-github-token.dpapi")){throw 'Original GitHub DPAPI token reference missing'}
          if(-not $source.Contains('if($WithResearchCollector -or $WithR29){Initialize-ResearchToken}')){throw 'R29 startup must reuse original enrollment'}
          if(-not $source.Contains('$researchSecret=Read-ResearchToken')){throw 'R29 courier must reuse original encrypted GitHub secret'}
          if($source.Contains('r29-github-token.dpapi') -or $source.Contains('Read-R29Token') -or $source.Contains('ResetR29Token')){throw 'Duplicate R29 token path or enrollment still present'}
          Write-Host 'R29_EXISTING_GITHUB_TOKEN_REUSE_VERIFIED'
      - name: R29 adaptive paper research 1 to 24 per day, 30d warmup/holdout and secured GitHub read-only bridge
        run: node --test runner/dynamic-research-scheduler.test.mjs runner/dynamic-research-outcomes.test.mjs runner/r29-adaptive-publisher.test.mjs runner/r29-adaptive-review.test.mjs
      - name: R29 adaptive module syntax, collector and courier wiring
        run: node --check runner/dynamic-research-scheduler.mjs && node --check runner/dynamic-research-outcomes.mjs && node --check runner/r29-adaptive-publisher.mjs && node --check runner/research-market-daemon.mjs && node --check runner/r29-windows-courier.mjs
      - name: R29 independent free security evidence research for GPT, fail-closed and bounded provider calls
        run: node --test runner/gpt-paper-security-research.test.mjs
      - name: R29 public security evidence read-only syntax
        run: node --check runner/gpt-paper-security-research.mjs
      - name: R29 GPT-only authenticated GitHub -> signed local paper BUY SELL, replay, no-cost and privacy checks
        run: node --test runner/gpt-paper-bridge.test.mjs runner/gpt-paper-github-relay.test.mjs
      - name: R29 GPT-only decision, owner-attributed courier, local risk and dashboard syntax
        run: node --check runner/gpt-paper-protocol.mjs && node --check runner/gpt-paper-github-relay.mjs && node --check runner/gpt-paper-local-receiver.mjs && node --check runner/gpt-paper-position-publisher.mjs && node --check runner/server.mjs && node --check runner/r29-windows-courier.mjs && node runner/dashboard-syntax-check.mjs
      - name: R29 independent local paper crypto security, risk and signed BUY/SELL offline tests
        run: node --test runner/live-paper-security.test.mjs runner/live-paper-autopilot.test.mjs runner/live-paper-public-status.test.mjs
      - name: R29 local autonomous paper syntax and UI validation
        run: node --check runner/live-paper-security.mjs && node --check runner/live-paper-risk.mjs && node --check runner/live-paper-autopilot.mjs && node --check runner/live-paper-public-status.mjs && node --check runner/paper-agent-pipeline.mjs && node --check runner/server.mjs && node runner/dashboard-syntax-check.mjs
      - name: R27 strict historical evidence, 615 frequency clocks, sealed AI, market gate and prospective capture (offline mocks)
        run: node --test research/r27/r27.test.mjs research/r27/r27-source-probe.test.mjs runner/r27-early-bridge.test.mjs runner/r27-exit-review.test.mjs
      - name: R27 syntax smoke on every platform
        run: node --check research/r27/r27-asof-frequency.mjs && node --check research/r27/r27-historical-ai.mjs && node --check research/r27/r27-source-probe.mjs && node --check research/r27/r27-report.mjs && node --check runner/r27-prospective-capture.mjs && node --check runner/r27-market-regime.mjs && node --check runner/r27-early-bridge.mjs && node --check runner/r27-exit-review.mjs
      - name: Chronological as-of intake, five-role barrier and isolated historical replay (offline)
        run: node --test research/replay-controller/controller.test.mjs research/replay-controller/asof-feed.test.mjs research/replay-controller/temporal-session.test.mjs research/replay-controller/role-task.test.mjs research/replay-controller/pseudonymize.test.mjs
      - name: R20 central fast replay - 8 isolated offline tests
        run: node --test research/replay-controller/continuous-runner.test.mjs research/replay-controller/r20-coverage.test.mjs
      - name: R22 model adapter safety and intake (mock transport, not real inference)
        run: node --test research/replay-controller/model-adapter.test.mjs research/replay-controller/r22-checkpoint.test.mjs
      - name: R20 throughput benchmark - 62 synthetic days with 310 fixture votes
        run: node research/replay-controller/r20-benchmark.mjs r20-synthetic-benchmark.json
      - name: Store measured R20 synthetic benchmark (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: r20-synthetic-throughput
          path: r20-synthetic-benchmark.json
          retention-days: 14
      - name: R21 multi-coin sealed evaluator, 50-case scheduler, read-only watchdog
        run: node --test research/replay-controller/r21-evaluate.test.mjs research/replay-controller/r21-catalog.test.mjs research/replay-controller/r21-observer.test.mjs research/replay-controller/r21-window-plan.test.mjs
      - name: R21 verify 50-case catalog schema without pretending to have historical data
        run: node research/replay-controller/r21-catalog.mjs research/replay-controller/r21-case-catalog.json
      - name: R23 free historical pool collector (offline mocked RPC, never a real memecoin result)
        run: node --test research/replay-controller/r23-onchain-discovery.test.mjs research/replay-controller/r23-merge-batches.test.mjs research/replay-controller/r23-blockscout-discovery.test.mjs
      - name: R25 outcome-blind actionable shadow-intent regression tests (NO fills)
        run: node --test research/replay-controller/r25-shadow-intents.test.mjs
      - name: Ephemeral local HTTP signed paper roundtrip and persisted replay
        run: node runner/paper-agent-loopback-e2e.mjs
