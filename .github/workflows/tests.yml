name: Sniper V2 Offline Paper Tests
on:
  push:
    branches-ignore:
      - 'coordination/**'
  pull_request:
permissions:
  contents: read
jobs:
  paper-only:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SNIPER_OFFLINE: '1'
      SNIPER_RESEARCH_READ: '0'
      SNIPER_RESEARCH_FEED: '0'
      SNIPER_LOCAL_DISCOVERY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check runner/server.mjs
      - run: node runner/dashboard-syntax-check.mjs
      - run: node runner/test.mjs
      - name: Offline research, signatures, ledger and replay regression tests
        run: node --test runner/paper-agent-pipeline.test.mjs runner/github-signed-agent-feed.test.mjs runner/isolated-paper-pipeline-selftest.test.mjs runner/market-pool-pinning.test.mjs runner/paper-lifecycle-policy.test.mjs runner/portfolio-budget.test.mjs runner/signed-research-quorum.test.mjs runner/historical-replay-readiness.test.mjs runner/breakout-forecast.test.mjs runner/pipeline-health.test.mjs runner/central-decisions.test.mjs runner/research.test.mjs runner/live-mode-policy.test.mjs runner/gateway.test.mjs runner/integration.test.mjs
      - name: Five-Dot replay controller and bridge audit (offline, synthetic fixtures)
        run: node --test research/replay-controller/controller.test.mjs research/replay-controller/bridge-audit.test.mjs
      - name: Ephemeral local HTTP signed paper roundtrip and persisted replay
        run: node runner/paper-agent-loopback-e2e.mjs
