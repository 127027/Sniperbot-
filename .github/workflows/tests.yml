name: Paper-Runner Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check runner/server.mjs
      - run: node runner/dashboard-syntax-check.mjs
      - name: Check actual public SOL to USDC to SOL roundtrip quotes (non-blocking)
        run: node runner/solana-roundtrip-live-probe.mjs
      - name: Observe Jupiter unsigned wallet-specific order assembly (no signing)
        run: node runner/solana-unsigned-order-live-probe.mjs
      - name: Observe public Jupiter real SOL to USDC rate (non-blocking, no swap)
        run: node runner/solana-quote-live-probe.mjs
      - run: node --check runner/core.mjs
      - run: node --check runner/market.mjs
      - run: node runner/test.mjs
      - run: node --test runner/*.test.mjs
      - run: node runner/v09-start-smoke.mjs
      - name: Observe one real public pool readback (non-blocking, read-only)
        run: node runner/readback-live-probe.mjs
  windows-v08-paper-lab:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test immutable news archive on Windows NTFS
        run: node --test runner/research-news-archive.test.mjs runner/research-news-journal.test.mjs
      - name: Test V0.8 paper execution parity and risk gates on Windows
        run: node --test runner/execution-parity-lab.test.mjs
  windows-v09-wallet-and-funding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V0.9 wallet and onramp lab modules
        run: |
          node --check runner/wallet-readiness.mjs
          node --check runner/paper-fiat-onramp.mjs
          node --check runner/v09-integration.mjs
          node --check runner/server.mjs
      - name: Verify strict no-secret watch-only policy and synthetic fiat only
        run: node --test runner/wallet-readiness.test.mjs runner/paper-fiat-onramp.test.mjs runner/v09-integration.test.mjs
      - name: Boot the actual local V0.9 HTTP server without touching real user data
        run: node runner/v09-start-smoke.mjs
      - name: Verify real external public pool crosschecks remain read-only
        run: node --test runner/live-pool-readback.test.mjs runner/readback-batch.test.mjs runner/readback-history.test.mjs runner/signed-research-quorum.test.mjs runner/readback-public-bridge.test.mjs runner/onchain-existence-readback.test.mjs runner/solana-mint-risk.test.mjs runner/candidate-dossiers.test.mjs
      - name: Test local shared memory role permissions, expiry, corruption and paper isolation
        run: node --test runner/agent-scratchpad.test.mjs
      - name: Parse wallet/payment HTML dashboard and bind all expected controls
        run: node runner/dashboard-syntax-check.mjs
      - name: Validate real local encrypted Solana wallet and public onchain readbacks
        run: node --test runner/local-solana-vault.test.mjs runner/local-solana-balance.test.mjs runner/solana-swap-quote.test.mjs runner/solana-swap-roundtrip.test.mjs runner/solana-owned-tokens.test.mjs runner/solana-wallet-activity.test.mjs runner/solana-unsigned-order.test.mjs
      - name: Verify actual native Windows supervisor and protected test secret handling
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File runner/windows-supervisor.ps1 -SelfTest
