name: Sniper V2 Offline Paper Tests
on:
  push:
    branches-ignore:
      - 'coordination/**'
  pull_request:
permissions:
  contents: read
jobs:
  paper-only:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SNIPER_OFFLINE: '1'
      SNIPER_RESEARCH_READ: '0'
      SNIPER_RESEARCH_FEED: '0'
      SNIPER_LOCAL_DISCOVERY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check runner/server.mjs
      - run: node runner/dashboard-syntax-check.mjs
      - run: node runner/test.mjs
      - name: Offline research, signatures, ledger and replay regression tests
        run: node --test runner/paper-agent-pipeline.test.mjs runner/github-signed-agent-feed.test.mjs runner/isolated-paper-pipeline-selftest.test.mjs runner/market-pool-pinning.test.mjs runner/paper-lifecycle-policy.test.mjs runner/portfolio-budget.test.mjs runner/signed-research-quorum.test.mjs runner/historical-replay-readiness.test.mjs runner/breakout-forecast.test.mjs runner/pipeline-health.test.mjs runner/central-decisions.test.mjs runner/research.test.mjs runner/live-mode-policy.test.mjs runner/gateway.test.mjs runner/integration.test.mjs
      - name: Chronological as-of intake, five-role barrier and isolated historical replay (offline)
        run: node --test research/replay-controller/controller.test.mjs research/replay-controller/asof-feed.test.mjs research/replay-controller/temporal-session.test.mjs research/replay-controller/role-task.test.mjs research/replay-controller/pseudonymize.test.mjs
      - name: R20 central fast replay - 8 isolated offline tests
        run: node --test research/replay-controller/continuous-runner.test.mjs research/replay-controller/r20-coverage.test.mjs
      - name: R22 model adapter safety and intake (mock transport, not real inference)
        run: node --test research/replay-controller/model-adapter.test.mjs research/replay-controller/r22-checkpoint.test.mjs
      - name: R20 throughput benchmark - 62 synthetic days with 310 fixture votes
        run: node research/replay-controller/r20-benchmark.mjs r20-synthetic-benchmark.json
      - name: Store measured R20 synthetic benchmark (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: r20-synthetic-throughput
          path: r20-synthetic-benchmark.json
          retention-days: 14
      - name: R21 multi-coin sealed evaluator, 50-case scheduler, read-only watchdog
        run: node --test research/replay-controller/r21-evaluate.test.mjs research/replay-controller/r21-catalog.test.mjs research/replay-controller/r21-observer.test.mjs research/replay-controller/r21-window-plan.test.mjs
      - name: R21 verify 50-case catalog schema without pretending to have historical data
        run: node research/replay-controller/r21-catalog.mjs research/replay-controller/r21-case-catalog.json
      - name: R23 free historical pool collector (offline mocked RPC, never a real memecoin result)
        run: node --test research/replay-controller/r23-onchain-discovery.test.mjs research/replay-controller/r23-merge-batches.test.mjs
      - name: Ephemeral local HTTP signed paper roundtrip and persisted replay
        run: node runner/paper-agent-loopback-e2e.mjs
