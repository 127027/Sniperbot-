name: R29 recover existing V4.2 preparation archive
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/archive-import-requests/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: r29-preparation-archive-import
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify explicit immutable import request
        run: |
          python - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          paths=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r',os.environ['GITHUB_SHA']],text=True).splitlines()
          assert len(paths)==1 and paths[0].startswith('research/archive-import-requests/')
          q=json.loads(Path(paths[0]).read_text())
          assert q=={'kind':'R29_IMPORT_EXISTING_V42_PREPARATION','source_run':44265274289,'source_artifact_id':14410027275,'no_new_market_calls':True,'no_orders':True}
          PY
      - uses: actions/download-artifact@v4
        with:
          name: r29-v4-october-all-launches-prefundamental-48h-neutral
          run-id: '44265274289'
          github-token: ${{ github.token }}
          path: /tmp/r29-v42-original
      - name: Verify and preserve only pre-midnight source audit files
        run: python scripts/r29-import-v42-preparation.py /tmp/r29-v42-original research/preparation/archive-v42
      - name: Persist exact pre-midnight archive in GitHub branch
        run: |
          test -z "$(git status --porcelain -- signals runner)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/preparation/archive-v42
          git diff --cached --name-only | grep -v '^research/preparation/archive-v42/' && exit 1 || true
          git commit -m "R29 preserve verified seven-day V4.2 predecision archive and complete midnight index"
          git push origin HEAD:refs/heads/codex/r29-cleanroom-paper-20261121
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-v42-preparation-import-manifest
          path: |
            research/preparation/archive-v42/manifest.json
            research/preparation/archive-v42/midnight-candidates.json
          retention-days: 30
