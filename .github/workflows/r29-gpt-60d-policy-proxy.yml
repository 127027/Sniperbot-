name: R29 GPT-authored 60-day as-of research policy proxy
on:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-gpt-60d-policy-proxy.yml'
      - 'research/replay-120d-real/gpt-authored-60d-policy-proxy*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  offline-historical-policy-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no-orders, creator-vetoes, adaptive cadence
        run: node --test research/replay-120d-real/gpt-authored-60d-policy-proxy.test.mjs
      - name: Restore real verified 43-day historical as-of frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r29-real-43day-frames
          gh run download 43944372099 \
            --repo 127027/Sniperbot- \
            --name r29-real-43day-minutefeature-asof-only \
            --dir /tmp/r29-real-43day-frames
          test -f /tmp/r29-real-43day-frames/SUMMARY.json
          test -f /tmp/r29-real-43day-frames/2026-09-24.json
          test -f /tmp/r29-real-43day-frames/2026-11-05.json
      - name: Restart 60-day research-policy replay from pinned as-of inputs
        run: |
          node research/replay-120d-real/gpt-authored-60d-policy-proxy.mjs \
            --frames /tmp/r29-real-43day-frames \
            --matrix research/replay-120d-real/results/REAL_60_DAY_EVIDENCE_MATRIX_43D_2026-11-16.csv \
            --out R29_60D_POLICY_PROXY_REPLAY
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const x=JSON.parse(readFileSync('R29_60D_POLICY_PROXY_REPLAY/R29_60D_POLICY_PROXY_SUMMARY.json','utf8'));
          assert.equal(x.days,60);
          assert.equal(x.days_with_historical_features,43);
          assert.equal(x.days_without_features,17);
          assert.equal(x.source_hourly_frames,1032);
          assert.equal(x.actual_gpt_model_calls_at_original_historical_times,0);
          assert.equal(x.valid_60_day_buy_hold_sell_pnl_test_usdc,null);
          assert.equal(x.real_trading_enabled,false);
          console.log('R29_60D_RESEARCH_ONLY_VERIFIED',x.policy_proxy_scans,x.watch_scan_signals);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-60day-gpt-authored-policy-proxy-replay-not-trades
          path: R29_60D_POLICY_PROXY_REPLAY/
          if-no-files-found: warn
