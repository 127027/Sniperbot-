name: R29 predecision evidence packets
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/predecision-packet-requests/**']
permissions:
  contents: write
concurrency:
  group: r29-predecision-evidence-packets
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r29-cleanroom-paper-20261121
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicit request
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const g=(...a)=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const p=g('diff-tree','--no-commit-id','--name-only','-r',process.env.GITHUB_SHA).split('\n');
          if(p.length!==1||!p[0].startsWith('research/predecision-packet-requests/'))throw Error('REQUEST_REQUIRED');
          const q=JSON.parse(g('show',process.env.GITHUB_SHA+':'+p[0]));
          if(q.kind!=='R29_PREDECISION_PACKET_BUILD'||q.no_orders!==true||q.no_market_calls!==true)throw Error('INVALID_REQUEST');
          JS
      - run: node --test test/r29-predecision-evidence-bridge.test.mjs
      - run: node scripts/r29-build-predecision-packets.mjs
      - name: Persist verified packets and evidence queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/preparation/decision-input
          git commit -m "R29 preserve all predecision evidence packets and 24-scan plan"
          git push origin HEAD:refs/heads/codex/r29-cleanroom-paper-20261121
