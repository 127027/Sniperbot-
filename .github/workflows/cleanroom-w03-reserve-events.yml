name: R29 W03 decode original Pump reserve events
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/w03-reserve-requests/**']
permissions:
  contents: read
  actions: read
jobs:
  reserve-decode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-pump-reserve-event.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: r29-v210-comparison-and-chain-45351015863
          run-id: '45351015863'
          github-token: ${{ github.token }}
          path: probe-artifacts/w03-original
      - run: node scripts/r29-w03-decode-reserve-events.mjs
      - if: always()
        run: test -z "$(git status --porcelain -- signals runner)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-w03-reserve-events-${{ github.run_id }}
          path: probe-artifacts/w03-reserves-*/
          retention-days: 30
