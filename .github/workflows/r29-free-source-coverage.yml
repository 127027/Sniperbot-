name: R29 free 60-day historical source coverage check
on:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-free-source-coverage.yml'
      - 'research/replay-120d-real/source-manifest-audit*'
      - 'research/replay-120d-real/results/REAL_60_DAY_EVIDENCE_MATRIX_43D_2026-11-16.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 60-day free-source manifest logic offline
        run: node --test research/replay-120d-real/source-manifest-audit.test.mjs
      - name: Fetch upstream public README and reconcile 60-day historical coverage
        run: |
          node research/replay-120d-real/source-manifest-audit.mjs \
            --matrix research/replay-120d-real/results/REAL_60_DAY_EVIDENCE_MATRIX_43D_2026-11-16.csv \
            --output R29_60DAY_LATEST_FREE_SOURCE_COVERAGE.json --fetch-latest
      - name: Archive provenance and unverified new-date discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-latest-free-source-coverage-research-only
          path: R29_60DAY_LATEST_FREE_SOURCE_COVERAGE.json
          if-no-files-found: warn
