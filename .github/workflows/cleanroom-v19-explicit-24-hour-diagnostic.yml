name: R29 Explicit 24 Hourly Source-Gap Diagnostic
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/diagnostic-24-requests/**'
permissions:
  contents: read
concurrency:
  group: r29-explicit-user-24hour-diagnostic
  cancel-in-progress: false
jobs:
  source-gap-diagnostic:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout exact user request commit, without persistable credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all source-only software regressions
        run: npm test
      - name: Report strict QA-04 release gate as NOT_READY (never authorize full historical backtest)
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Execute user-requested isolated 24 hourly model diagnosis and postdecision 65 reference audit
        run: node scripts/v19-run-explicit-hourly-diagnostic.mjs
      - name: Verify model did not write any GitHub trade signals
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals/index.json signals/orders signals/receipts)"
      - name: Upload model diagnostic and separate postdecision reference result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-24hour-user-diagnostic-${{ github.run_id }}
          path: |
            probe-artifacts/v19-hourly-user-oct12-*
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
