name: R29 preparation neutral source acquisition
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/preparation-source-requests/**']
permissions:
  contents: read
concurrency:
  group: r29-preparation-neutral-source
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-preparation-queue.test.mjs
      - run: node scripts/r29-preparation-source-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-preparation-source-${{ github.run_id }}
          path: probe-artifacts/preparation-source-*/
          retention-days: 30
