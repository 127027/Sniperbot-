name: R29 Nine GPT Memecoin Watch Outcomes - Posthoc Research Only
on:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-nine-gpt-watch-posthoc-labels.yml'
      - 'research/replay-120d-real/posthoc-nine-watch-label-audit.py'
      - 'research/replay-120d-real/test_posthoc_nine_watch_label_audit.py'
      - 'research/replay-120d-real/reviews/2026-11-17-nine-watch-current-gpt-retrospective-review.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-observed-outcomes-after-frozen-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SNIPER_OFFLINE: '1'
      SNIPER_RESEARCH_READ: '0'
      SNIPER_RESEARCH_FEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local read-only Parquet parser
        run: python -m pip install --disable-pip-version-check --quiet pyarrow==18.1.0
      - name: Run unit proofs that future labels do not become trading decisions
        run: python -m unittest discover -s research/replay-120d-real -p 'test_posthoc_nine_watch_label_audit.py' -v
      - name: Fetch SHA-256 pinned seven historical source days after all nine GPT reviews were frozen
        run: python research/replay-120d-real/posthoc-nine-watch-label-audit.py
      - name: Verify no PnL or self-trades were asserted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/replay-120d-real/generated/r29-nine-watch-posthoc-outcomes-20261117.json')
          r=json.loads(p.read_text())
          assert r['summary']['reviewed']==9
          assert r['summary']['research_watch']==6
          assert r['summary']['research_no_trade']==3
          assert r['summary']['realizable_gpt_usdc_portfolio_pnl'] is None
          assert len(r['sources'])==7
          assert all(x['realized_pnl_test_usdc'] is None and not x['roi_proven'] for x in r['outcomes'])
          print('R29_NINE_OUTCOMES_AUDITED',r['summary'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-nine-gpt-reviewed-memecoins-posthoc-onchain-labels-not-trades
          path: research/replay-120d-real/generated/r29-nine-watch-posthoc-outcomes-20261117.json
          if-no-files-found: warn
          retention-days: 30
