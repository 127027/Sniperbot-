name: R29 V2.8 Exact 24 Scanner BUY HOLD SELL Evidence Report
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/24-scan-ledger-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-v28-sha-pinned-24-scanner-proof
  cancel-in-progress: false
jobs:
  audited-24-scan-report:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Read only checkout of the exact explicitly approved research request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Python 3.12 read only evidence reporter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax plus 11 negative evidence and position lifecycle unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/v28-exact-24-scan-evidence-ledger.py
          python test/v28-exact-24-scan-evidence-ledger.test.py
      - name: Download ORIGINAL frozen 24 hourly model action diagnostic, zero true GPT/Windows fills
        uses: actions/download-artifact@v4
        with:
          name: r29-24hour-user-diagnostic-45257966772
          repository: 127027/Sniperbot-
          run-id: '45257966772'
          github-token: ${{ github.token }}
          path: probe-artifacts/v28-frozen-original-scans
      - name: Download complete raw 11 and 12 October neutral Solana mint universe
        uses: actions/download-artifact@v4
        with:
          name: r29-v26-full-oct12-raw-neutral-source-45272055484
          repository: 127027/Sniperbot-
          run-id: '45272055484'
          github-token: ${{ github.token }}
          path: probe-artifacts/v28-v26
      - name: Download exact SHA-reverified two neutral original blockchain sell witnesses
        uses: actions/download-artifact@v4
        with:
          name: r29-v27-three-source-neutral-onchain-bridge-45276830073
          repository: 127027/Sniperbot-
          run-id: '45276830073'
          github-token: ${{ github.token }}
          path: probe-artifacts/v28-v27
      - name: Build exact 24-scan model and client BUY HOLD SELL report plus CSV and JSON
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v28-exact-24-scan-evidence-ledger.py \
            probe-artifacts/v28-frozen-original-scans \
            probe-artifacts/v28-v26 \
            probe-artifacts/v28-v27 \
            "probe-artifacts/v28-24-scan-report-${{ github.run_id }}"
      - name: Verify no BUY SELL GitHub signals or broker state altered
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals runner)"
      - name: Preserve complete 24 hourly evidence ledger and user-readable table
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v28-exact-24-scan-actions-${{ github.run_id }}
          path: probe-artifacts/v28-24-scan-report-*/
          retention-days: 30
          if-no-files-found: warn
