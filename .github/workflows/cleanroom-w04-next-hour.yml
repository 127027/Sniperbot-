name: R29 W04 next historical hour and retrospective execution gate
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/w04-next-hour-requests/**']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/r29-retrospective-execution.test.mjs
      - run: node scripts/r29-w04-next-hour.mjs
      - if: always()
        run: test -z "$(git status --porcelain -- signals runner)"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r29-w04-next-hour-${{ github.run_id }}
          path: probe-artifacts/w04-next-hour-*/
          retention-days: 30
