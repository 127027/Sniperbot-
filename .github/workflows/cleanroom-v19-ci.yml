name: R29 V1.9 Cleanroom Tests Only
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'research/config/**'
      - 'package.json'
      - '.github/workflows/cleanroom-v19-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r29-cleanroom-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  local-model-regression:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout immutable branch commit without push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22 – no API keys or wallet secrets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax checks for paper-only paths
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core.mjs
          node --check src/runner.mjs
          node --check src/dashboard.mjs
          node --check src/v19-paper-monitor.mjs
          node --check src/v19-dot3-authenticated-gate.mjs
          node --check src/v19-paper-exit-convergence.mjs
          node --check scripts/v18-backtest-on-demand.mjs
      - name: Run complete repository unit and regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-artifacts
          npm test 2>&1 | tee probe-artifacts/v19-node-tests.tap
      # Formal 29h Backtest CLIs are deliberately excluded from routine CI.
      # User requested all remaining prep work EXCEPT the Backtest.
      # They remain available ONLY through explicitly approved
      # .github/workflows/cleanroom-v19-explicit-offline-request.yml.
      - name: Audit three original GitHub captures and nine offline readiness workstreams
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v19-offline-final-readiness-audit.mjs
      - name: Review each original PARTIAL acceptance and future backtest gates
        shell: bash
        run: |
          set -euo pipefail
          # Read only the latest existing source evidence; NO provider HTTP.
          node scripts/v19-audit-all-partials-and-backtest-readiness.mjs
      - name: Original 61-task release gate audit – no Backtest until independent 100-percent evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Confirm test job did not publish signals or alter tracked index
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain -- signals/index.json signals/orders signals/receipts | wc -l | tr -d ' ')" = "0"
          node --input-type=module -e 'import {readFileSync} from "node:fs";const i=JSON.parse(readFileSync("signals/index.json","utf8"));if(i.mode!=="PAPER"||!Array.isArray(i.orders))throw Error("INVALID_PAPER_SIGNAL_INBOX");console.log("TEST_ONLY_NO_SIGNAL_WRITE",i.orders.length)'

      - name: Write source-pinned read-only test receipt
        if: ${{ always() }}
        shell: bash
        env:
          R29_CI_SHA: ${{ github.sha }}
          R29_CI_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p probe-artifacts
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync} from 'node:fs';
          const path='probe-artifacts/v19-node-tests.tap';
          const log=existsSync(path)?readFileSync(path,'utf8'):'';
          const count=name=>Number(log.match(new RegExp('^# '+name+' (\\d+)$','m'))?.[1]??-1);
          const report={
            schema:1,kind:'R29_V19_NODE_CI_RUN_RECEIPT',
            immutable_checkout_commit:process.env.R29_CI_SHA,
            workflow_run_id:process.env.R29_CI_RUN,
            node_version:process.version,
            tests:count('tests'),passed:count('pass'),failed:count('fail'),
            no_orders_published_by_ci:true,
            provider_or_dot_provenance_not_proved:true,
            workflow_conclusion_must_be_verified_via_actions_api:true
          };
          writeFileSync('probe-artifacts/v19-node-ci-receipt.json',
            JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Upload immutable test evidence only, never orders
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v19-node-tests-${{ github.run_id }}
          path: |
            probe-artifacts/v19-node-tests.tap
            probe-artifacts/v19-node-ci-receipt.json
            probe-artifacts/v19-qa04-*.json
            probe-artifacts/v19-six-offline-final-readiness.json
            probe-artifacts/v19-all-46-partial-acceptance-and-backtest-readiness.json
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
            probe-artifacts/v19-offline-raw-archive/**
          if-no-files-found: error
          retention-days: 30
