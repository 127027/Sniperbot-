name: R29 V2.5 Original Two Pool Minute Candle Finalization Forensics
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/candle-finalization-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-v25-pinned-two-pool-historical-candle-causal-audit
  cancel-in-progress: false
jobs:
  offline-source-candle-finalization:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Exact user-authorized request commit without GitHub write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Node 22 for source-audit only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New source auditor static syntax checks
        run: |
          set -euo pipefail
          node --check scripts/v25-audit-pinned-two-pool-candle-finality.mjs
          node --check src/v25-retro-two-pool-candle-finality-audit.mjs
      - name: All provenance and no-orders regression tests
        run: npm test
      - name: Download the pinned November postevent two-neutral-pool original raw source
        uses: actions/download-artifact@v4
        with:
          name: r29-two-pool-gecko-research-45132577450
          repository: 127027/Sniperbot-
          run-id: '45132577450'
          github-token: ${{ github.token }}
          path: probe-artifacts/verified-two-pools
      - name: Audit pinned real October retrospective candles against mandatory 60 second finalization buffer
        run: node scripts/v25-audit-pinned-two-pool-candle-finality.mjs
      - name: Confirm signal/order/receipt files unchanged
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Preserve pinned original source finalization report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v25-retro-candle-finality-${{ github.run_id }}
          path: probe-artifacts/v25-retro-candle-finality-*/
          retention-days: 30
          if-no-files-found: warn
