name: R29 second chronological 01-20 GPT-neutral asof research input
on:
  workflow_dispatch:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-next-0120-neutral-source-frame.yml'
      - 'research/replay-120d-real/neutral-next20-minute-gpt-candidate-frame*'
permissions:
  contents: read
jobs:
  next-real-historical-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate correct virtual 01:20 source boundary
        run: node --test research/replay-120d-real/neutral-next20-minute-gpt-candidate-frame.test.mjs
      - name: Read only up to virtual 01:20 event from neutral 01:00 archive
        run: node research/replay-120d-real/neutral-next20-minute-gpt-candidate-frame.mjs R29_NEXT_0120_NEUTRAL/2026-09-18T012000Z-mint-pool-candidates.json
      - name: Do not feed future outcomes to GPT and do not invent trades
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const d=JSON.parse(readFileSync('R29_NEXT_0120_NEUTRAL/2026-09-18T012000Z-mint-pool-candidates.json','utf8'));
          assert.equal(d.virtual_asof_utc,'2026-09-18T01:20:00.000Z');
          assert.equal(d.stream_stopped_at_first_later_event,true);
          assert.equal(d.source_future_coin_winners_used,false);
          assert.equal(d.historical_GPT_calls_from_this_input,0);
          assert.equal(d.realized_test_usdc_pnl,null);
          console.log('R29_NEXT_0120_CHRONOLOGICAL_INPUT',d.raw_events_examined_before_asof,d.eligible_neutral_mint_pool_keys,d.ranked_neutral_cohort_not_all_market.length);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-historic-second-0120-source-frame-after-first-lesson-no-trades
          path: R29_NEXT_0120_NEUTRAL/
          if-no-files-found: warn
          retention-days: 30
