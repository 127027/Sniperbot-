name: R29 Original Solana Pool Owner Token Deltas Strict Offline Research
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/oct12-pool-owner-token-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-original-oct12-pool-owner-token-account-research
  cancel-in-progress: false
jobs:
  readonly-original-four-transaction-account-movements:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout only approved source artifact request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm all other unit/regression tests remain green
        run: |
          node --check src/v19-oct12-verified-pool-token-account-deltas.mjs
          node --check scripts/v19-audit-four-real-oct12-pool-owner-token-moves.mjs
          npm test
      - name: Keep formal original D3 and QA04 acceptance gates unchanged
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Download four raw SHA-pinned original Solana V1 transaction responses
        uses: actions/download-artifact@v4
        with:
          name: r29-oct12-v1-four-transaction-research-45135625789
          repository: 127027/Sniperbot-
          run-id: '45135625789'
          github-token: ${{ github.token }}
          path: probe-artifacts/original-v1-four-tx
      - name: Analyze only original pool owner token account raw deltas without network
        run: node scripts/v19-audit-four-real-oct12-pool-owner-token-moves.mjs
      - name: Verify no GitHub trading or account file was written
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Upload SHA-verified offline blockchain account movement audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-original-oct12-pool-owner-deltas-${{ github.run_id }}
          path: |
            probe-artifacts/r29-original-pool-token-delta-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
