name: R29 neutral 120-day historical hourly archive coverage
on:
  workflow_dispatch:
  push:
    branches:
      - codex/r29-chatgpt-github-paper-cycle-20261115
    paths:
      - '.github/workflows/r29-neutral-hourly-archive-coverage.yml'
      - 'research/replay-120d-real/shrine-neutral-hourly-index-audit*'
permissions:
  contents: read
jobs:
  read-only-archive-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test neutral source selection and 120-day missing hours
        run: node --test research/replay-120d-real/shrine-neutral-hourly-index-audit.test.mjs
      - name: Fetch public index only - NO trading, NO token shortlists
        run: node research/replay-120d-real/shrine-neutral-hourly-index-audit.mjs R29_HOURLY_ARCHIVE_INDEX/120d-archive-hours.json
      - name: Verify no trade profit or model runs were invented
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {strict as assert} from 'node:assert';
          const r=JSON.parse(readFileSync('R29_HOURLY_ARCHIVE_INDEX/120d-archive-hours.json','utf8'));
          assert.equal(r.days.length,120);
          assert.equal(r.individual_GPT_model_scans_conducted,0);
          assert.equal(r.portfolio_pnl_test_usdc,null);
          assert.equal(r.no_user_known_winner_list_used,true);
          assert.equal(r.executable_historical_bidirectional_quotes_attested,false);
          console.log('R29_INDEX_COVERAGE_CHECK',r.train_hour_total,r.test_hour_total);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r29-120d-neutrally-discovered-hourly-archive-coverage-only
          path: R29_HOURLY_ARCHIVE_INDEX/
          if-no-files-found: warn
          retention-days: 30
