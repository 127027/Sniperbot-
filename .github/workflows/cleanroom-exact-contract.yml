name: R31 exact contract live probe
on:
  push:
    branches: ['codex/r31-autonomy-recovery']
    paths: ['research/cleanroom/exact-contract-probe.mjs','.github/workflows/cleanroom-exact-contract.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cleanroom/exact-contract-probe.mjs --self-test
      - name: Actual address-first market retrieval
        run: |
          set -o pipefail
          node research/cleanroom/exact-contract-probe.mjs solana 63LfDmNb3MQ8mw9MtZ2To9bEA2M71kZUUGq5tiJxcqj9 ethereum 0x00f116ac0c304c570daaa68fa6c30a86a04b5c5f base 0xb166e8b140d35d9d8226e40c09f757bac5a4d87d optimism 0x2598c30330d5771ae9f983979209486ae26de875 | tee exact-probe.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: exact-contract-probe
          path: exact-probe.jsonl
