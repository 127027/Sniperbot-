name: R32 separated producer consumer tests
on:
  push:
    branches: [codex/r32-decoupled-paper]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test r31/policy.test.mjs r31/paper-engine.test.mjs r31/device-account.test.mjs r31/publisher.test.mjs r31/telemetry.test.mjs r31/android/mobile.test.mjs r31/android/end-to-end.test.mjs r32/strategy.test.mjs r32/scalable.test.mjs r32/intent-execution.test.mjs
