name: R29 Oct12 Original Solana 3-Slot Readonly Block Order Audit
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/oct12-slot-order-requests/**'
permissions:
  contents: read
concurrency:
  group: r29-oct12-three-original-slot-order
  cancel-in-progress: false
jobs:
  readonly-original-slot-signature-order:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout user-requested one-file source-only run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source safety regressions and valid read-only RPC code
        run: |
          node --check src/v19-oct12-solana-verified-block-order.mjs
          node --check scripts/v19-research-oct12-three-solana-blocks-order.mjs
          npm test
      - name: Never waive D3 issuer, sellability or QA04 historic evidence gates
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Audit exact 3 historical Solana slots without keys or trading
        run: node scripts/v19-research-oct12-three-solana-blocks-order.mjs
      - name: Ensure no signal, order, receipt or paper ledger was modified
        shell: bash
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Upload original 3 block JSON response bytes and receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-original-oct12-solana-three-blocks-${{ github.run_id }}
          path: |
            probe-artifacts/r29-original-oct12-slot-order-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
