name: R29 Readonly Two-Pool Gecko Historic OHLCV Research
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/gecko-two-pool-requests/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: r29-two-pool-archive-gecko-research
  cancel-in-progress: false
jobs:
  postrun-only-provider-crosscheck:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout exact explicit research request commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all regression cases and script syntax before network
        run: |
          node --check scripts/v19-research-gecko-two-pools.mjs
          npm test
      - name: Inspect unchanged strict QA04 release gate before postrun study
        run: node scripts/v19-verify-100pct-before-backtest.mjs
      - name: Download frozen actual 192-mint Dex capture source with raw receipts
        uses: actions/download-artifact@v4
        with:
          name: r29-current-pool-research-45132061221
          repository: 127027/Sniperbot-
          run-id: '45132061221'
          github-token: ${{ github.token }}
          path: probe-artifacts/prior-dex-research
      - name: Research EXACT two public pools and historic candle availability after event only
        run: node scripts/v19-research-gecko-two-pools.mjs
      - name: Prove no existing GitHub order or fill state is modified
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Upload entire source raw and separated second-source research receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-two-pool-gecko-research-${{ github.run_id }}
          path: |
            probe-artifacts/r29-retro-gecko-*/
            probe-artifacts/v19-61-original-tasks-prebacktest-gate.json
          if-no-files-found: warn
          retention-days: 30
