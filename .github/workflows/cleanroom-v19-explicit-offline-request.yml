name: R29 V1.9 Explicit Offline 29h Backtest Request
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/offline-backtest-requests/**'
permissions:
  contents: read
concurrency:
  group: r29-offline-backtest-request
  cancel-in-progress: false
jobs:
  isolated-offline-backtest:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout exact approved request commit without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Setup Node 22 for offline replay only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard original evidence gates and isolated model receipt audit
        shell: bash
        run: |
          set -euo pipefail
          node --test test/v19-manual-backtest-request.test.mjs test/v19-replay-isolation.test.mjs test/v19-qa04-offline-model-ledger-audit.test.mjs
      - name: Execute exactly one explicit 29h research-only request
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v19-explicit-offline-backtest-request.mjs
      - name: Assert no signals, client orders or actual fills were published
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain -- signals/index.json signals/orders signals/receipts | wc -l | tr -d ' ')" = "0"
          node --input-type=module -e 'import {readFileSync} from "node:fs";const x=JSON.parse(readFileSync("signals/index.json","utf8"));if(x.mode!=="PAPER"||x.orders?.length)throw Error("OFFLINE_REPLAY_PUBLISHED_ORDERS");console.log("OFFLINE_BACKTEST_NO_CLIENT_ORDERS",x.orders.length)'
      - name: Preserve isolated source-pinned request and replay reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v19-offline-backtest-${{ github.run_id }}
          path: |
            probe-artifacts/v19-explicit-offline-29h-${{ github.run_id }}.json
            probe-artifacts/v19-explicit-offline-29h-receipt-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
