name: R20 instant diagnostic replay advance on fresh Dot decision
on:
  push:
    branches:
      - codex/dots-pepe-replay-20261113
    paths:
      - research/replay-controller/bridge/diagnostic-frames/**/decisions/*.json
      - research/replay-controller/bridge/diagnostic-first-frame/decisions/*.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pepe-replay-20261114-nightwatch
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: codex/dots-pepe-replay-20261113
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Process already committed five-dot decisions only
        run: node research/replay-controller/r20-diagnostic-bridge.mjs
      - name: Strict whitelist of changed diagnostic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/replay-controller/monitor/r20-progress.json
          if [ -d research/replay-controller/runs/watch-20261114-diagnostic ]; then
            git add -f research/replay-controller/runs/watch-20261114-diagnostic
          fi
          if [ -d research/replay-controller/bridge/diagnostic-frames ]; then
            find research/replay-controller/bridge/diagnostic-frames -name input.json -print0 | xargs -0 -r git add -f --
          fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              research/replay-controller/monitor/r20-progress.json|research/replay-controller/runs/watch-20261114-diagnostic/*|research/replay-controller/bridge/diagnostic-frames/*/input.json) ;;
              *) echo "Refusing unexpected staged file $file" >&2; exit 1 ;;
            esac
          done
          if git diff --cached --quiet; then
            echo "No new decisions sealed."
            exit 0
          fi
          git commit -m "R20: immediately seal available five-role diagnostic frames"
          git pull --rebase origin codex/dots-pepe-replay-20261113
          git push origin HEAD:codex/dots-pepe-replay-20261113
