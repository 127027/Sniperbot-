name: R29 V2.3 Four Source Gecko Neutral Fallback
on:
  push:
    branches:
      - codex/r29-cleanroom-paper-20261121
    paths:
      - 'research/gecko-fallback-requests/**'
permissions:
  contents: read
concurrency:
  group: r29-v23-exact-neutral-gecko-fallback
  cancel-in-progress: false
jobs:
  neutral-gecko-source-check:
    if: ${{ github.ref == 'refs/heads/codex/r29-cleanroom-paper-20261121' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R29_MODE: PAPER
      R29_ENABLE_LIVE: ''
    steps:
      - name: Checkout immutable branch commit without writer credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Software and no-orders regression tests
        run: npm test
      - name: Four bounded read-only public GeckoTerminal identity lookups
        run: node scripts/v23-gecko-neutral-fallback.mjs
      - name: Check that client trading inbox and receipts were not modified
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- signals)"
      - name: Archive raw HTTP and identity findings, never orders
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r29-v23-gecko-neutral-postevent-${{ github.run_id }}
          path: probe-artifacts/v23-gecko-neutral-*/
          retention-days: 30
          if-no-files-found: warn
