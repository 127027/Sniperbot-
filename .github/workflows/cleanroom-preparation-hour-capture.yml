name: R29 durable sequential preparation archive capture
on:
  push:
    branches: [codex/r29-cleanroom-paper-20261121]
    paths: ['research/preparation-hour-requests/**']
permissions:
  contents: write
concurrency:
  group: r29-preparation-hour-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r29-cleanroom-paper-20261121
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify request ancestry and configure checkpoint writer
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node --test test/r29-preparation-hour.test.mjs test/r29-preparation-queue.test.mjs
      - run: node scripts/r29-preparation-hour-worker.mjs
